spring.application.name=ace-teamup

# DataSource - supports local default + Aiven / Render / Railway environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:ace_teamup}?useSSL=${MYSQL_USE_SSL:false}&sslMode=${MYSQL_SSL_MODE:PREFERRED}&serverTimezone=UTC&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=CONVERT_TO_NULL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:123456}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP) - tuned for cloud databases like Aiven
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Server (Render / Railway inject dynamic $PORT)
server.port=${PORT:8080}

# Logging
logging.level.root=INFO
logging.level.com.aceteamup=INFO

# JWT
app.jwt.secret=${JWT_SECRET:aceTeamUpSuperSecretKeyForJWT2024PleaseChangeInProductionEnvironment}
app.jwt.expiration-ms=86400000

# AI Service
ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8000}
