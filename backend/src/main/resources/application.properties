spring.application.name=ace-teamup

# DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/ace_teamup?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Server
server.port=8080

# Logging
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.aceteamup=DEBUG

# JWT
app.jwt.secret=aceTeamUpSuperSecretKeyForJWT2024PleaseChangeInProductionEnvironment
app.jwt.expiration-ms=86400000

# AI Service
ai.service.url=http://127.0.0.1:8000
